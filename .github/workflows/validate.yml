# Validate a pull request: image metadata and size, routine files, and that output/ is rebuilt.
# Make "validate / check" a required status check on main.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Images and routines
        run: python3 tools/check_images.py
      - name: Output and web/data.js are rebuilt from the routines and images
        # Lines that differ only in measured colors (style="--step: ..." in output/, one edge color
        # line per image in web/data.js) are ignored: JPEG decoding may differ slightly between
        # Pillow builds. Any other difference means the files are stale.
        run: |
          python3 tools/build.py
          git diff --exit-code -I 'style="--step:' -I '^  "[a-z0-9-]+": \["#' -- output/ web/data.js \
            || { echo "Run python3 tools/build.py and commit output/ and web/data.js."; exit 1; }
