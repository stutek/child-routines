<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Static page, no server: scripts only from this site, no inline scripts, no forms, no outside
       images; styles inline (the sheet CSS) and the font from Google Fonts. file: keeps it working
       when opened from a checkout. GitHub Pages cannot send headers, so frame-ancestors is not set. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' 'unsafe-inline'; font-src 'self' file:; img-src 'self' file:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Otrokove rutine · Child routines</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <!-- three glyphs (broom, globe, danger sign) from the one-colour Noto Emoji (SIL OFL, fonts/OFL-NotoEmoji.txt), subset and served from this site -->
  <style>
    @font-face { font-family: 'Noto Emoji'; font-style: normal; font-weight: 600; font-display: block; src: url('fonts/noto-emoji-subset.woff2') format('woff2'); unicode-range: U+26a0, U+1f310, U+1f9f9; }
  </style>
  <!-- Sheet maker: works offline from a checkout (file://) and on any static host. What the parent types stays in the browser. -->
  <style>
    .maker {
      width: 100%;
      max-width: 840px;
      background: #ffffff;
      border-radius: 16px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 118, 110, 0.12);
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 15px;
    }
    .maker h1 { font-size: 24px; color: #115E59; }   /* teal of the icon (icon.svg): gender-neutral, calm */
    .maker h1 .logo { width: 1.25em; height: 1.25em; vertical-align: -0.25em; margin-right: 8px; }
    .maker h2 { font-size: 16px; color: #115E59; margin-bottom: -6px; }
    .maker .about { line-height: 1.4; }
    .maker .lang { display: flex; align-items: center; gap: 6px; }
    .maker .globe { font-family: 'Noto Emoji', sans-serif; font-weight: 600; font-size: 20px; color: #115E59; }
    .maker p { color: #475569; line-height: 1.4; }
    .maker input, .maker select, .maker button { font: inherit; font-size: 15px; }
    .maker input, .maker select { border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 8px; background: #fff; min-width: 0; }
    .maker button { border: none; border-radius: 10px; padding: 5px 12px; font-weight: 700; cursor: pointer; background: #e2e8f0; color: #0f172a; }
    /* the action buttons share one shape; Print has its own fill (.preview-label .print) */
    .maker button.secondary { border-radius: 12px; padding: 6px 16px; font-size: 16px; }
    .maker button:not(.del):not(.thumb):not(.grip) { background: #DDF3EE; color: #115E59; }
    .maker .hint { font-size: 13px; color: #475569; }
    .maker .linkbox { flex: 1 1 260px; }
    .maker .undo { font-size: 14px; color: #115E59; }
    .maker .undo button { padding: 4px 10px; margin-left: 4px; }
    .maker button:disabled { opacity: 0.45; cursor: not-allowed; }
    /* skip link: off screen until it has focus (WCAG 2.4.1); its click moves focus, it never changes the address (the sheet lives in the fragment) */
    .skip { position: fixed; left: 8px; top: -100px; z-index: 20; padding: 8px 14px; border-radius: 10px; background: #0F766E; color: #fff; font-weight: 700; text-decoration: none; }
    .skip:focus { top: 8px; outline: 3px solid #0F172A; outline-offset: 2px; }
    .maker :focus-visible { outline: 3px solid #0F766E; outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .maker .safety { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #44403C; line-height: 1.4; }
    .maker .safety ul { margin: 2px 0 0 18px; }
    .maker .safety li { margin-top: 0; }
    .maker .safety .danger { font-family: 'Noto Emoji', sans-serif; font-weight: 600; font-size: 22px; line-height: 1.1; color: #B45309; }
    .maker .about a { color: #115E59; font-weight: 700; }
    .row-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    .row-top .grow { flex: 1 1 200px; }
    .row-top.fields { align-items: flex-end; }
    /* the label sits on the top edge of its field's outline, visible while typing */
    .field { position: relative; display: flex; flex-direction: column; padding-top: 8px; }
    .field-label { position: absolute; top: 0; left: 9px; z-index: 1; padding: 0 4px; background: #ffffff; line-height: 16px; }
    .field-label, .step-head span { font-size: 12.5px; font-weight: 700; color: #115E59; }
    .field select, .field input { padding-top: 9px; }
    .step-head span:nth-child(-n+2) { visibility: hidden; }
    .how { margin-left: 20px; color: #475569; line-height: 1.4; }
    .sheet-box { border: 1px solid #E7E0D3; border-radius: 16px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; }
    .step { display: grid; grid-template-columns: 22px 24px minmax(0, 1fr) 110px 40px 32px; gap: 6px; align-items: center; }
    .step .n { font-weight: 800; color: #64748b; text-align: right; }
    .no-times .step { grid-template-columns: 22px 24px minmax(0, 1fr) 40px 32px; }
    .no-times .step input[type=time], .no-times .col-time { display: none; }
    /* the grip: six dots next to the fixed step number; drag it, tap it, or use the arrow keys */
    .maker button.grip { display: flex; align-items: center; justify-content: center; padding: 6px 0; background: transparent;
                         color: #64748b; cursor: grab; touch-action: none; border-radius: 8px; }
    .maker button.grip:active { cursor: grabbing; }
    .grip .dots { width: 9px; height: 15px; background: radial-gradient(circle, currentColor 1.4px, transparent 1.8px) 0 0 / 4.5px 5px; }
    .step > * { transition: transform 0.15s; }
    .step.dragging > :not(.n) { position: relative; z-index: 2; transition: none; }
    .step.dragging input { box-shadow: 0 6px 16px rgba(15, 118, 110, 0.25); }
    .step.dragging .grip { color: #0F766E; }
    .step { border-radius: 10px; }
    .step.picked { background: #DDF3EE; }
    .step.picked .grip { color: #0F766E; }
    @media (prefers-reduced-motion: reduce) { .step > * { transition: none; } }
    /* the checkbox in the page's teal, its label like the field labels */
    .maker input[type=checkbox] { accent-color: #0F766E; width: 18px; height: 18px; vertical-align: -3px; margin: 0 4px 0 0; }
    .maker .check { font-weight: 700; color: #115E59; padding-bottom: 6px; }
    .maker button.del { padding: 4px 0; background: transparent; color: #dc2626; line-height: 1; }
    .maker button.del .broom { font-family: 'Noto Emoji', sans-serif; font-size: 22px; }
    .maker button.del:hover { color: #991b1b; }
    .maker button.thumb { width: 40px; height: 40px; padding: 0; border-radius: 10px; overflow: hidden; background: #f1f5f9;
                          border: 2px solid #e2e8f0; font-size: 22px; color: #94a3b8; }
    .maker button.thumb.missing { border-color: #f59e0b; background: #fffbeb; color: #b45309; }
    /* border and icon at least 3 : 1 against the background (WCAG 1.4.11): #64748b is 4.8 : 1 on white, 4.5 : 1 on #f8fafc */
    .maker button.thumb.empty { background: #f8fafc; border-style: dashed; border-color: #64748b; color: #64748b; }
    .maker input.title { font-weight: 700; }
    /* labels print in capitals, so the fields show them that way too */
    .maker input.title, .step input:not([type=time]) { text-transform: uppercase; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; padding: 8px 0 8px 28px; }
    .gallery[hidden] { display: none; }
    .maker .gallery button { padding: 0; aspect-ratio: 1; border-radius: 12px; overflow: hidden; font-size: 14px; background: #f1f5f9; }
    .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .warnings { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 10px 14px; }
    .warnings li { margin-left: 18px; line-height: 1.5; color: #92400e; }
    .warnings.ok { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    @media (max-width: 640px) {
      body { padding: 8px !important; gap: 16px !important; }
      .maker { padding: 12px; }
      .step input[type=time] { font-size: 13px; padding: 6px 2px; }
      .maker button.thumb { width: 38px; height: 38px; }
      /* phone: the time goes under the label, so a 17-character label shows whole; grip and broom at least 24 px (WCAG 2.2, 2.5.8) */
      .step, .no-times .step { grid-template-columns: 14px 24px minmax(0, 1fr) 38px 24px; gap: 4px; }
      .step input[type=time] { grid-row: 2; grid-column: 3; justify-self: start; width: 110px; }
      .step-head .col-time { display: none; }
      .gallery { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); padding-left: 0; }
    }
    @media (max-width: 360px) {
      .step input:not([type=time]) { font-size: 13px; padding: 6px 5px; }   /* 17 characters fit on the smallest phones */
    }
    .layout { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    /* the preview takes the column's width, so fitPreview() scales the sheet to it, not to itself */
    #preview { width: 100%; max-width: 840px; }
    #sheets { display: flex; flex-direction: column; gap: 24px; }
    .preview-label { font-weight: 800; font-size: 15px; color: #334155; background: #ffffff; border-radius: 10px; padding: 8px 8px 8px 14px; margin-bottom: 10px; display: inline-flex; align-items: center; gap: 14px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
    .preview-label .print { font: inherit; font-size: 16px; font-weight: 700; border: none; border-radius: 12px; padding: 8px 20px; cursor: pointer; background: #0F766E; color: #ffffff; }
    .preview-label .print:hover { background: #115E59; }
    .preview-label .print:focus-visible { outline: 3px solid #0F766E; outline-offset: 2px; }
    /* Wide screen: form on the left, the sheets on the right, staying in view while you edit */
    @media screen and (min-width: 1100px) {
      body { display: block !important; padding: 16px !important; }
      .layout { display: grid; grid-template-columns: minmax(440px, 1fr) minmax(0, 1fr); align-items: start; gap: 16px; }
      .maker { max-width: none; }
      #preview { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }   /* square: the sheet prints with square corners */
      /* the label and Print float small in the top right corner, over the sheet's empty sky, so the sheet gets the full height */
      .preview-label { position: absolute; top: 6px; right: 6px; z-index: 5; margin: 0; padding: 4px 4px 4px 10px; gap: 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18); }
      .preview-label .print { font-size: 14px; padding: 5px 14px; border-radius: 9px; }
      .preview-label.in-flow { position: static; margin: 0 0 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }   /* when it would cover the title */
      /* the form scrolls in its own column, next to what it scrolls; the page itself does not */
      html, body { height: 100%; overflow: hidden; }
      .maker { max-height: calc(100vh - 32px); overflow-y: auto; }
    }
    @media print {
      .maker, .preview-label { display: none !important; }
      html, body { height: auto !important; overflow: visible !important; }
      .layout { display: block !important; }
      #preview { position: static !important; max-height: none !important; overflow: visible !important; }
      #sheets { zoom: 1 !important; gap: 0 !important; }
    }
  </style>
  <script src="data.js"></script>
</head>
<body>
  <div id="announce" class="sr-only" aria-live="polite"></div>
  <a href="#" class="skip" id="skip"></a>
  <main class="layout">
    <div class="maker" id="maker"></div>
    <section id="preview"><div class="preview-label" id="preview-label"></div><div id="sheets"></div></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
