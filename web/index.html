<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Static page, no server: scripts only from this site, no inline scripts, no forms, no outside
       images; styles inline (the sheet CSS) and the font from Google Fonts. file: keeps it working
       when opened from a checkout. GitHub Pages cannot send headers, so frame-ancestors is not set. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' file:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Routine Sheet Maker</title>
  <!-- Sheet maker: works offline from a checkout (file://) and on any static host. What the parent types stays in the browser. -->
  <style>
    .maker {
      width: 100%;
      max-width: 840px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-size: 15px;
    }
    .maker h1 { font-size: 22px; }
    .maker p { color: #475569; line-height: 1.4; }
    .maker input, .maker select, .maker button { font: inherit; font-size: 15px; }
    .maker input, .maker select { border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 8px; background: #fff; min-width: 0; }
    .maker button { border: none; border-radius: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; background: #e2e8f0; color: #0f172a; }
    .maker button.primary { background: #1d4ed8; color: #ffffff; }
    .maker button:disabled { opacity: 0.45; cursor: not-allowed; }
    .row-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .row-top .grow { flex: 1 1 200px; }
    .sheet-box { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .sheet-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .sheet-head .title { flex: 1 1 220px; font-weight: 700; }
    .step { display: grid; grid-template-columns: 24px minmax(0, 1.6fr) 110px minmax(0, 1.4fr) 32px; gap: 6px; align-items: center; }
    .step .n { font-weight: 800; color: #64748b; text-align: right; }
    .step .del { padding: 4px 0; background: transparent; color: #94a3b8; font-size: 18px; }
    .hint { font-size: 13px; color: #64748b; padding-left: 30px; margin-top: -4px; }
    .hint.warn { color: #b45309; }
    .warnings { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 10px 14px; }
    .warnings li { margin-left: 18px; line-height: 1.5; color: #92400e; }
    .warnings.ok { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    @media (max-width: 640px) {
      .step { grid-template-columns: 20px minmax(0, 1fr) 96px 28px; }
      .step select { grid-column: 2 / 4; }
    }
    @media print { .maker { display: none !important; } }
  </style>
  <script src="data.js"></script>
</head>
<body>
  <div class="maker" id="maker"></div>
  <div id="preview"></div>
  <script src="app.js"></script>
</body>
</html>
