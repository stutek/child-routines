<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Static page, no server: scripts only from this site, no inline scripts, no forms, no outside
       images; styles inline (the sheet CSS) and the font from Google Fonts. file: keeps it working
       when opened from a checkout. GitHub Pages cannot send headers, so frame-ancestors is not set. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' file:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Routine Sheet Maker</title>
  <!-- one glyph (the broom on the row clear button) from the one-colour Noto Emoji, SIL OFL, served by Google Fonts;
       offline the system's colour emoji shows instead -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Emoji:wght@500&text=%F0%9F%A7%B9&display=block">
  <!-- Sheet maker: works offline from a checkout (file://) and on any static host. What the parent types stays in the browser. -->
  <style>
    .maker {
      width: 100%;
      max-width: 840px;
      background: #ffffff;
      border-radius: 16px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(91, 42, 110, 0.12);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-size: 15px;
    }
    .maker h1 { font-size: 24px; color: #5B2A6E; }
    .maker p { color: #475569; line-height: 1.4; }
    .maker input, .maker select, .maker button { font: inherit; font-size: 15px; }
    .maker input, .maker select { border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 8px; background: #fff; min-width: 0; }
    .maker button { border: none; border-radius: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; background: #e2e8f0; color: #0f172a; }
    .maker button.primary { background: #7C3AED; color: #ffffff; box-shadow: 0 3px 0 #5B21B6; }
    .maker button.primary:hover { background: #6D28D9; }
    .maker button:not(.primary):not(.del):not(.thumb) { background: #F3E8FF; color: #5B2A6E; }
    .maker button:disabled { opacity: 0.45; cursor: not-allowed; }
    .row-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .row-top .grow { flex: 1 1 200px; }
    .how { margin-left: 20px; color: #475569; line-height: 1.5; }
    .sheet-box { border: 1px solid #EDE4F7; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .sheet-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .sheet-head .title { flex: 1 1 220px; font-weight: 700; }
    .step { display: grid; grid-template-columns: 22px minmax(0, 1fr) 110px 52px 32px; gap: 6px; align-items: center; }
    .step .n { font-weight: 800; color: #64748b; text-align: right; }
    .no-times .step { grid-template-columns: 22px minmax(0, 1fr) 52px 32px; }
    .no-times .step input[type=time] { display: none; }
    .maker button.del { padding: 4px 0; background: transparent; color: #dc2626; line-height: 1; }
    .maker button.del .broom { font-family: 'Noto Emoji', sans-serif; font-size: 22px; }
    .maker button.del:hover { color: #991b1b; }
    .maker button.thumb { width: 52px; height: 52px; padding: 0; border-radius: 10px; overflow: hidden; background: #f1f5f9;
                          border: 2px solid #e2e8f0; font-size: 22px; color: #94a3b8; }
    .maker button.thumb.missing { border-color: #f59e0b; background: #fffbeb; color: #b45309; }
    .maker button.thumb.empty { background: #f8fafc; border-style: dashed; }
    .maker input.title { font-weight: 700; }
    /* labels print in capitals, so the fields show them that way too */
    .maker input.title, .step input:not([type=time]) { text-transform: uppercase; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; padding: 8px 0 8px 28px; }
    .gallery[hidden] { display: none; }
    .maker .gallery button { padding: 0; aspect-ratio: 1; border-radius: 12px; overflow: hidden; font-size: 14px; background: #f1f5f9; }
    .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .note { font-size: 13px; color: #b45309; }
    .warnings { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 10px 14px; }
    .warnings li { margin-left: 18px; line-height: 1.5; color: #92400e; }
    .warnings.ok { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    @media (max-width: 640px) {
      body { padding: 8px !important; gap: 16px !important; }
      .maker { padding: 14px; }
      .step { grid-template-columns: 16px minmax(0, 1fr) 74px 44px 22px; gap: 4px; }
      .step input[type=time] { font-size: 13px; padding: 6px 2px; }
      .maker button.thumb { width: 44px; height: 44px; }
      .no-times .step { grid-template-columns: 16px minmax(0, 1fr) 44px 22px; }
      .gallery { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); padding-left: 0; }
    }
    .layout { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    #sheets { display: flex; flex-direction: column; gap: 24px; }
    .preview-label { font-weight: 800; font-size: 15px; color: #334155; background: #ffffff; border-radius: 10px; padding: 8px 14px; margin-bottom: 10px; display: inline-block; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
    /* Wide screen: form on the left, the sheets on the right, staying in view while you edit */
    @media screen and (min-width: 1100px) {
      body { display: block !important; padding: 16px !important; }
      .layout { display: grid; grid-template-columns: minmax(440px, 1fr) minmax(0, 1fr); align-items: start; gap: 16px; }
      .maker { max-width: none; }
      #preview { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; border-radius: 12px; }
    }
    @media print {
      .maker, .preview-label { display: none !important; }
      .layout { display: block !important; }
      #preview { position: static !important; max-height: none !important; overflow: visible !important; }
      #sheets { zoom: 1 !important; gap: 0 !important; }
    }
  </style>
  <script src="data.js"></script>
</head>
<body>
  <div class="layout">
    <div class="maker" id="maker"></div>
    <div id="preview"><div class="preview-label" id="preview-label"></div><div id="sheets"></div></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
